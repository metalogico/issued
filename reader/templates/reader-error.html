{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-lg">
  <i data-lucide="file-x" class="mx-auto mb-4 h-14 w-14 text-violet-400"></i>
  <h1 class="text-xl font-bold text-gray-900">Comic unavailable</h1>
  <p class="mt-2 text-gray-600">{{ message }}</p>
  <a href="{{ return_url }}"
    class="mt-6 inline-flex items-center gap-2 rounded-xl bg-violet-600 px-4 py-2.5 font-semibold text-white transition hover:bg-violet-700">
    <i data-lucide="arrow-left" class="h-4 w-4"></i>
    {{ return_label }}
  </a>
</div>
{% endblock %}
